services:
  - type: web
    name: birge-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn birge.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: birge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com

  - type: postgresql
    name: birge-db
    plan: free
